<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberVerse — Register</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <h1>Create Account</h1>
                <p class="auth-subtitle">Join CyberVerse to start learning cybersecurity</p>

                <form id="registerForm">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="John Doe" required>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="student@cyberverse.io" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>

                    <!-- New Confirm Password Field -->
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>

                    <div id="formError" class="form-error"></div>

                    <button type="submit" class="btn btn-primary auth-button">Create Account</button>
                </form>

                <p class="auth-bottom">
                    Already have an account? <a href="login.html">Log In</a>
                </p>
                <a href="index.html" class="back-home">&larr; Back to Home</a>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
